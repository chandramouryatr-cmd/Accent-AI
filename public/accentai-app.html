<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>AccentAI — Master Native-Level English</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f5;
    color: #0a0a0a;
    user-select: none;
    -webkit-user-select: none;
    line-height: 1.5;
  }
  input, textarea, [contenteditable], p, li, h1, h2, h3, h4 { user-select: text; -webkit-user-select: text; }
  button { touch-action: manipulation; border: none; background: none; font: inherit; color: inherit; cursor: pointer; }
  :focus:not(:focus-visible) { outline: none; }

  /* App shell — phone frame on desktop, full-screen on mobile */
  #app {
    max-width: 440px;
    margin: 0 auto;
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
  }
  @media (min-width: 500px) {
    body { padding: 20px 0; }
    #app { min-height: calc(100vh - 40px); border-radius: 32px; overflow: hidden; }
  }

  .screen { flex: 1; display: none; flex-direction: column; }
  .screen.active { display: flex; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px; padding-bottom: 100px; }
  .scroll::-webkit-scrollbar { width: 4px; }
  .scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 2px; }

  /* Typography */
  .hero { font-size: 30px; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
  .h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .h2 { font-size: 20px; font-weight: 700; }
  .h3 { font-size: 17px; font-weight: 600; }
  .body { font-size: 15px; color: #18181b; }
  .body-sm { font-size: 13px; color: #52525b; }
  .caption { font-size: 12px; font-weight: 500; color: #71717a; }
  .ipa { font-size: 22px; font-weight: 500; font-family: "Charis SIL", "Doulos SIL", Georgia, serif; }
  .muted { color: #71717a; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 14px; font-weight: 700; font-size: 16px; transition: opacity 0.15s, transform 0.1s; }
  .btn:active { opacity: 0.7; transform: scale(0.98); }
  .btn-primary { background: #10b981; color: #fff; }
  .btn-dark { background: #0a0a0a; color: #fff; }
  .btn-outline { border: 1px solid #e4e4e7; background: #fff; color: #0a0a0a; }
  .btn-ghost { background: #f4f4f5; color: #0a0a0a; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row > .btn { flex: 1; }

  /* Cards */
  .card { background: #f8f8f8; border-radius: 18px; padding: 16px; }
  .card-dark { background: #0a0a0a; color: #fff; border-radius: 20px; padding: 20px; }
  .card-border { border: 1px solid #e4e4e7; border-radius: 16px; padding: 16px; background: #fff; }

  /* Onboarding */
  .onboard-hero { text-align: center; padding: 40px 20px; }
  .onboard-logo { width: 80px; height: 80px; border-radius: 24px; background: #d1fae5; display: inline-flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 20px; }
  .feature-pills { display: flex; gap: 8px; margin-bottom: 28px; }
  .feature-pill { flex: 1; display: flex; align-items: center; gap: 6px; padding: 10px 12px; background: #f4f4f5; border-radius: 100px; font-size: 11px; font-weight: 600; }
  .input { width: 100%; padding: 14px 16px; border: 1px solid #e4e4e7; border-radius: 14px; font-size: 16px; background: #f8f8f8; font-family: inherit; }
  .input:focus { outline: none; border-color: #10b981; background: #fff; }
  .accent-option { display: flex; align-items: center; justify-content: space-between; padding: 16px; border: 2px solid #e4e4e7; border-radius: 16px; margin-bottom: 10px; transition: all 0.15s; }
  .accent-option.selected { border-color: #10b981; background: #d1fae5; }
  .accent-option-left { display: flex; align-items: center; gap: 12px; }
  .accent-flag { font-size: 28px; }
  .check-circle { width: 24px; height: 24px; border-radius: 50%; background: #10b981; display: flex; align-items: center; justify-content: center; color: #fff; }

  /* Dashboard */
  .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-top: env(safe-area-inset-top); }
  .accent-badge { width: 44px; height: 44px; border-radius: 50%; background: #d1fae5; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .stat-chip { flex: 1; background: #f8f8f8; border-radius: 14px; padding: 12px; text-align: center; }
  .stat-chip .val { font-size: 18px; font-weight: 700; margin-top: 4px; }
  .ring-wrap { display: flex; align-items: center; gap: 16px; background: #f8f8f8; border-radius: 20px; padding: 16px; margin-bottom: 20px; }
  .ring { width: 72px; height: 72px; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: #10b981; }

  /* Lesson card */
  .lesson-cta { display: flex; align-items: center; gap: 14px; background: #0a0a0a; color: #fff; border-radius: 20px; padding: 16px; margin-bottom: 24px; }
  .lesson-cta-icon { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
  .lesson-cta-meta { flex: 1; min-width: 0; }
  .progress-bar { height: 6px; background: #f4f4f5; border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: #10b981; border-radius: 3px; transition: width 0.3s; }

  /* Journey */
  .phase-card { border: 1px solid #e4e4e7; border-radius: 18px; margin-bottom: 12px; overflow: hidden; background: #fff; }
  .phase-header { display: flex; align-items: center; gap: 14px; padding: 16px; }
  .phase-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .phase-body { padding: 0 8px 8px; }
  .lesson-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; }
  .lesson-row:active { background: #f8f8f8; }
  .lesson-num { width: 32px; height: 32px; border-radius: 50%; background: #f4f4f5; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #71717a; flex-shrink: 0; }
  .lesson-num.done { background: #10b981; color: #fff; }
  .difficulty-badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
  .diff-easy { background: #d1fae5; color: #059669; }
  .diff-medium { background: #fef3c7; color: #d97706; }
  .diff-hard { background: #fee2e2; color: #dc2626; }
  .chevron { color: #a1a1aa; transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }

  /* Lesson player */
  .lesson-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 1px solid #f4f4f5; }
  .lesson-progress { flex: 1; height: 6px; background: #f4f4f5; border-radius: 3px; overflow: hidden; }
  .lesson-progress-fill { height: 100%; background: #10b981; border-radius: 3px; transition: width 0.3s; }
  .step-content { flex: 1; overflow-y: auto; padding: 24px 24px 120px; }
  .step-badge { font-size: 12px; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .sound-card { display: flex; align-items: center; gap: 16px; background: #d1fae5; border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .sound-symbol { font-size: 56px; font-weight: 700; color: #10b981; font-family: "Charis SIL", Georgia, serif; }
  .play-btn { width: 44px; height: 44px; border-radius: 50%; background: #10b981; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .play-btn:active { opacity: 0.7; }
  .info-chip { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #e4e4e7; border-radius: 12px; margin-bottom: 8px; }
  .info-chip-label { font-size: 12px; font-weight: 700; color: #71717a; min-width: 60px; text-transform: uppercase; }
  .tap-word { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #f8f8f8; border-radius: 14px; margin-bottom: 8px; }
  .tap-word:active { opacity: 0.7; }
  .quiz-option { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 2px solid #e4e4e7; border-radius: 14px; margin-bottom: 10px; background: #fff; }
  .quiz-option:active { opacity: 0.7; }
  .quiz-option.correct { border-color: #10b981; background: #d1fae5; }
  .quiz-option.wrong { border-color: #ef4444; background: #fee2e2; }
  .quiz-letter { width: 28px; height: 28px; border-radius: 50%; background: #f4f4f5; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #71717a; flex-shrink: 0; }
  .quiz-option.correct .quiz-letter { background: #10b981; color: #fff; }
  .quiz-option.wrong .quiz-letter { background: #ef4444; color: #fff; }
  .tip-box { display: flex; gap: 12px; padding: 20px; border-radius: 20px; }
  .tip-info { background: #dbeafe; color: #1e40af; }
  .tip-success { background: #d1fae5; color: #065f46; }
  .tip-warning { background: #fef3c7; color: #92400e; }

  /* Bottom nav */
  .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e4e4e7; display: flex; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; color: #71717a; font-size: 11px; font-weight: 600; }
  .nav-item.active { color: #10b981; }
  .nav-icon { font-size: 22px; line-height: 1; }

  /* Practice */
  .phrase-card-dark { background: #0a0a0a; color: #fff; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
  .phrase-card-dark .ipa { color: rgba(255,255,255,0.85); }
  .transcript-box { border: 1px solid #e4e4e7; border-radius: 16px; padding: 16px; margin-bottom: 20px; }

  /* Coach */
  .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #e4e4e7; padding-top: calc(12px + env(safe-area-inset-top)); }
  .chat-msg { display: flex; gap: 8px; margin-bottom: 12px; }
  .chat-msg.user { justify-content: flex-end; }
  .chat-bubble { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 21px; }
  .chat-msg.assistant .chat-bubble { background: #f8f8f8; border-bottom-left-radius: 4px; }
  .chat-msg.user .chat-bubble { background: #10b981; color: #fff; border-bottom-right-radius: 4px; }
  .chat-avatar { width: 28px; height: 28px; border-radius: 50%; background: #d1fae5; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; margin-top: 2px; }
  .chat-input-row { display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #e4e4e7; }
  .chat-input { flex: 1; min-height: 40px; max-height: 100px; padding: 10px 14px; border: 1px solid #e4e4e7; border-radius: 20px; font-size: 15px; font-family: inherit; background: #f8f8f8; resize: none; }
  .chat-input:focus { outline: none; border-color: #10b981; background: #fff; }
  .chat-send { width: 44px; height: 44px; border-radius: 50%; background: #10b981; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .chat-send:disabled { background: #f4f4f5; color: #a1a1aa; }
  .suggestion-chip { padding: 8px 12px; border: 1px solid #e4e4e7; border-radius: 100px; font-size: 12px; font-weight: 500; }

  /* More */
  .stat-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  .stat-box { width: calc(50% - 5px); background: #f8f8f8; border-radius: 14px; padding: 14px; }
  .stat-box .val { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .setting-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #f4f4f5; }
  .setting-row:last-child { border-bottom: none; }
  .setting-row:active { background: #f8f8f8; }
  .badge-chip { padding: 8px 12px; background: #d1fae5; border-radius: 100px; font-size: 12px; font-weight: 600; color: #059669; }

  /* Misc */
  .section-title { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .empty { text-align: center; padding: 60px 20px; color: #71717a; }
  .listening-pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>

<script>
// ═══════════════════════════════════════════════════════════
// AccentAI — Single-file HTML app

const PHASES = [
  { id: 0, emoji: "👂", name: "Basic Sound Awareness", desc: "Vowels, Consonants, Mouth Positioning", lessons: ["Vowel Sounds A–E","Consonant Clusters","Mouth Positioning","Listening Recognition"], xp: 500, badge: "Sound Seeker 🔈", color: "#6366f1" },
  { id: 1, emoji: "🗣️", name: "Word Pronunciation", desc: "Common Words, Syllable Stress", lessons: ["100 Core Words","Syllable Stress Rules","Silent Letters","Slow Repetition Drills"], xp: 600, badge: "Word Warrior 📖", color: "#8b5cf6" },
  { id: 2, emoji: "🎵", name: "Sentence Rhythm", desc: "Connected Speech, Native Pacing", lessons: ["Linking Words","Sentence Melody","Rhythm Patterns","Chunking Speech"], xp: 700, badge: "Rhythm Rider 🎵", color: "#d946ef" },
  { id: 3, emoji: "💬", name: "Conversational Patterns", desc: "Everyday Conversations, Emotional Expression", lessons: ["Casual Greetings","Expressing Emotions","Questions & Answers","Small Talk Mastery"], xp: 750, badge: "Chat Champion 💬", color: "#ec4899" },
  { id: 4, emoji: "⚡", name: "Native Compression", desc: "Fast Speech, Reduced Sounds, Contractions", lessons: ["Gonna & Wanna","Reduced Vowels","Elision & Assimilation","Fast Speech Decoding"], xp: 800, badge: "Speed Speaker ⚡", color: "#f43f5e" },
  { id: 5, emoji: "🪞", name: "Accent Mimicking", desc: "Shadow Speaking, Copy Native Speakers", lessons: ["Shadowing Technique","Prosody Copying","Tone Matching","Character Voices"], xp: 850, badge: "Mirror Master 🪞", color: "#f97316" },
  { id: 6, emoji: "🏢", name: "Real-World Scenarios", desc: "Interviews, Presentations, Phone Calls", lessons: ["Job Interview English","Presentation Skills","Phone Communication","Public Speaking"], xp: 900, badge: "World Ready 🌍", color: "#10b981" },
  { id: 7, emoji: "👑", name: "Advanced Native Fluency", desc: "Near-native Mastery, Dynamic Speaking", lessons: ["Tone Adaptation","Humor & Irony","Regional Variants","Master Performance"], xp: 1000, badge: "Accent Master 👑", color: "#22d3ee" },
];

const LESSONS = [
  {
    id: "p1l1", phaseId: 0, lessonIndex: 0, title: "Vowel Sounds A–E",
    subtitle: "Master the 5 core vowel sounds", duration: 8, xp: 120,
    steps: [
      { type: "intro", title: "Vowel Sounds A–E", subtitle: "The foundation of every accent", description: "Vowels are the musical heart of speech. Before consonants, before rhythm — your brain must map the 5 core American vowels. This lesson rewires that mapping through physical triggers and auditory contrast.", emoji: "🔤" },
      { type: "concept", title: "The 5 Core Vowels", body: ["American English has roughly 14 vowel sounds, but 5 of them — the 'long' A, E, I, O, U — appear in almost every word you speak.", "Each vowel is defined by where your tongue sits: HIGH or LOW, FRONT or BACK. Get the tongue position right and the sound follows naturally."], bulletPoints: ["/eɪ/ as in FACE — front-high, gliding", "/iː/ as in FLEECE — front-high, tense", "/aɪ/ as in PRICE — center-low to front-high", "/oʊ/ as in GOAT — back-mid, rounded", "/æ/ as in TRAP — front-low, spread lips"] },
      { type: "mouth-diagram", title: "Mouth Position for /iː/", description: "For the /iː/ sound (as in 'see'), push your tongue forward and up — almost touching the roof of your mouth. Lips spread into a slight smile. This is the most 'forward' vowel.", tonguePosition: "front-high", lipShape: "spread", sound: "iː", exampleWord: "see / sheep / machine" },
      { type: "mouth-diagram", title: "Mouth Position for /eɪ/", description: "For the /eɪ/ sound (as in 'face'), start with your tongue in a front-mid position, then glide upward toward /ɪ/. Lips stay slightly spread. It's a diphthong — two sounds blending into one smooth motion.", tonguePosition: "front-mid", lipShape: "spread", sound: "eɪ", exampleWord: "face / say / play" },
      { type: "mouth-diagram", title: "Mouth Position for /aɪ/", description: "For the /aɪ/ sound (as in 'price'), drop your jaw and start with the tongue low and central, then glide up to a high front position. Lips are open and relaxed throughout. Feel the jaw close as the tongue rises.", tonguePosition: "central-mid", lipShape: "slightly-open", sound: "aɪ", exampleWord: "price / time / my" },
      { type: "mouth-diagram", title: "Mouth Position for /oʊ/", description: "For the /oʊ/ sound (as in 'goat'), pull your tongue back to mid-height and round your lips into a small 'O' shape. The lips protrude slightly forward. This is the most 'back' of the 5 core vowels.", tonguePosition: "back-low", lipShape: "rounded", sound: "oʊ", exampleWord: "goat / go / boat" },
      { type: "mouth-diagram", title: "Mouth Position for /æ/", description: "For /æ/ (as in 'cat'), drop your jaw and flatten your tongue low and forward. Lips spread wider than for /e/. This is the sound that gives American English its characteristic openness.", tonguePosition: "front-low", lipShape: "spread", sound: "æ", exampleWord: "cat / bad / apple" },
      { type: "example", title: "Hear It in Action", phrase: "She sees the green sheep near the stream", ipa: "/ʃiː siːz ðə ɡriːn ʃiːp nɪr ðə striːm/", tip: "Every stressed word here contains /iː/. Listen for that bright, forward quality.", tapWords: [{word:"she",ipa:"/ʃiː/"},{word:"sees",ipa:"/siːz/"},{word:"green",ipa:"/ɡriːn/"},{word:"sheep",ipa:"/ʃiːp/"}] },
      { type: "tap-pronounce", title: "Tap to Hear Each Vowel", description: "Tap each word to hear the vowel. Pay attention to your tongue — it should move noticeably between them.", words: [{word:"face",ipa:"/feɪs/",meaning:"/eɪ/"},{word:"fleece",ipa:"/fliːs/",meaning:"/iː/"},{word:"price",ipa:"/praɪs/",meaning:"/aɪ/"},{word:"goat",ipa:"/ɡoʊt/",meaning:"/oʊ/"},{word:"trap",ipa:"/træp/",meaning:"/æ/"}] },
      { type: "tip", title: "💡 Native Trick", body: "Most learners pronounce /æ/ too close to /e/. Drop your jaw LOWER than feels natural — almost like you're about to bite an apple. That extra space is what makes it sound American.", variant: "info" },
      { type: "practice", title: "Now You Try", phrase: "Pat met Kate at the gate", ipa: "/pæt mɛt keɪt æt ðə ɡeɪt/", tip: "Alternate between /æ/ (Pat, at) and /eɪ/ (Kate, gate). Feel the jaw drop on /æ/.", passScore: 70 },
      { type: "quiz", question: "Which vowel sound requires the LOWEST tongue position in the front of the mouth?", options: ["/iː/ as in 'see'", "/eɪ/ as in 'face'", "/æ/ as in 'cat'", "/oʊ/ as in 'goat'"], correct: 2, explanation: "/æ/ is a front-low vowel — the tongue sits at the bottom of the mouth, pushed forward. /iː/ is front-high, /eɪ/ is front-mid, and /oʊ/ is back-mid." },
      { type: "completion", title: "Vowel Sounds A–E Complete!", subtitle: "You can now identify and produce the 5 core American vowels.", xp: 120, badge: "🔊 Vowel Pioneer", nextLessonTitle: "Consonant Clusters" },
    ]
  },
  {
    id: "p1l2", phaseId: 0, lessonIndex: 1, title: "Consonant Clusters",
    subtitle: "Master tricky consonant combinations", duration: 7, xp: 100,
    steps: [
      { type: "intro", title: "Consonant Clusters", subtitle: "When consonants collide", description: "English allows consonant clusters that many languages don't. /str/, /pl/, /θr/ — these combinations trip up learners worldwide. This lesson trains your mouth to flow through them.", emoji: "⛓️" },
      { type: "concept", title: "What is a Cluster?", body: ["A consonant cluster is 2 or more consonants in a row with no vowel between them.", "English permits up to 3 consonants at the start of a syllable (e.g. 'split') and up to 4 at the end (e.g. 'sixths')."], bulletPoints: ["/str/ — string, strong, street", "/pl/ — play, please, plus", "/θr/ — three, through, throw", "/skw/ — square, squeeze"] },
      { type: "tap-pronounce", title: "Tap to Hear Clusters", description: "Listen to how the consonants flow together without a vowel inserted between them.", words: [{word:"string",ipa:"/strɪŋ/",meaning:"/str/"},{word:"play",ipa:"/pleɪ/",meaning:"/pl/"},{word:"three",ipa:"/θriː/",meaning:"/θr/"},{word:"square",ipa:"/skwɛr/",meaning:"/skw/"},{word:"splash",ipa:"/splæʃ/",meaning:"/spl/"}] },
      { type: "tip", title: "💡 Common Mistake", body: "Many learners insert a tiny vowel before clusters — saying 'es-tree' instead of 'string'. Don't add a vowel. Let the consonants touch directly.", variant: "warning" },
      { type: "practice", title: "Try It", phrase: "Strong strings stretch straight", ipa: "/strɔŋ strɪŋz strɛtʃ strɛt/", tip: "Keep the /str/ tight — no vowel between the consonants.", passScore: 70 },
      { type: "completion", title: "Consonant Clusters Complete!", subtitle: "You can now produce tricky consonant clusters without inserting vowels.", xp: 100, badge: "🔗 Cluster Crusher", nextLessonTitle: "Mouth Positioning" },
    ]

// ─── State ───
const STORAGE_KEY = "accentai-html-state";
const defaultState = {
  onboarded: false, accent: "usa", userName: "Learner",
  xp: 0, streak: 0, lastActiveDate: "",
  lessons: {}, badges: [], history: [],
  dailyGoal: 3, dailyGoalCompleted: 0, dailyGoalDate: todayStr(),
  chatMessages: [],
};
let state = loadState();

function todayStr() { return new Date().toISOString().slice(0,10); }
function loadState() {
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) return {...defaultState, ...JSON.parse(s)}; } catch(e) {}
  return {...defaultState};
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }

// ─── TTS ───
let voicesCache = [];
function loadVoices() { try { voicesCache = window.speechSynthesis.getVoices(); } catch(e) {} }
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, opts = {}) {
  if (!('speechSynthesis' in window)) { alert("Text-to-speech not supported in this browser."); return; }
  try { window.speechSynthesis.cancel(); } catch(e) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = opts.accent === "uk" ? "en-GB" : "en-US";
  u.rate = opts.rate ?? 0.92;
  const preferred = voicesCache.find(v => v.lang === u.lang && /google|natural|online|neural/i.test(v.name))
    || voicesCache.find(v => v.lang === u.lang)
    || voicesCache.find(v => v.lang.startsWith("en"));
  if (preferred) u.voice = preferred;
  try { window.speechSynthesis.speak(u); } catch(e) {}
}
function stopSpeaking() { try { window.speechSynthesis.cancel(); } catch(e) {} }

// ─── Speech Recognition ───
let recognition = null;
function getRecognition() {
  if (recognition) return recognition;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  recognition = new SR();
  recognition.lang = state.accent === "uk" ? "en-GB" : "en-US";
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;
  return recognition;
}

// ─── Navigation ───
let currentScreen = null;
let currentLesson = null;
let currentStepIdx = 0;
let quizAnswer = null;
let practiceScore = null;
let practiceTranscript = "";
let listening = false;

function navigate(screen) {
  currentScreen = screen;
  render();
  document.querySelector('.scroll')?.scrollTo?.(0, 0);
  window.scrollTo(0, 0);
}

function openLesson(lessonId) {
  currentLesson = LESSONS.find(l => l.id === lessonId);
  currentStepIdx = 0;
  quizAnswer = null;
  practiceScore = null;
  practiceTranscript = "";
  navigate("lesson");
}

// ─── Difficulty ───
function getDifficulty(lesson) {
  if (lesson.phaseId <= 1) return lesson.phaseId === 1 && lesson.lessonIndex >= 2 ? "medium" : "easy";
  if (lesson.phaseId <= 3) return lesson.phaseId === 3 && lesson.lessonIndex >= 2 ? "hard" : "medium";
  if (lesson.phaseId <= 5) return lesson.lessonIndex >= 2 ? "hard" : "medium";
  return "hard";
}

// ─── Helpers ───
function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k,v]) => {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "onclick") e.onclick = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    if (typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  });
  return e;
}

function toggleListen() {
  if (listening) { stopListening(); return; }
  const rec = getRecognition();
  if (!rec) { alert("Speech recognition not supported in this browser. Try Chrome or Edge."); return; }
  practiceTranscript = "";
  practiceScore = null;
  let accumulated = "";
  rec.onresult = (e) => {
    const r = e.results[e.results.length-1];
    if (r) { accumulated = r[0].transcript; practiceTranscript = accumulated; render(); }
  };
  rec.onend = () => {
    listening = false;
    const phrase = QUICK_PHRASES[currentPhraseIdx].phrase.toLowerCase().replace(/[^a-z\s]/g,"");
    const heard = accumulated.toLowerCase().replace(/[^a-z\s]/g,"");
    const tw = phrase.split(/\s+/).filter(Boolean);
    const hw = heard.split(/\s+/).filter(Boolean);
    const matched = tw.filter(w => hw.includes(w)).length;
    practiceScore = tw.length > 0 ? Math.round((matched/tw.length)*100) : 0;
    if (practiceScore >= 70) { state.xp += 10; saveState(); }
    render();
  };
  rec.onerror = () => { listening = false; render(); };
  rec.start();
  listening = true;
  render();
}
function stopListening() { try { getRecognition()?.stop(); } catch(e){} listening = false; render(); }

async function sendCoach(text) {
  text = (text || "").trim();
  if (!text) return;
  state.chatMessages.push({ id: `u-${Date.now()}`, role: "user", content: text, timestamp: Date.now() });
  saveState();
  render();
  const input = document.getElementById("coach-input");
  if (input) input.value = "";

  // Try the backend if available, else fallback to local response
  let reply = "";
  try {
    const res = await fetch("/api/ai-coach", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: state.chatMessages.filter(m => m.id !== "welcome").map(m => ({ role: m.role, content: m.content })),
        context: { accent: state.accent, xp: state.xp, streak: state.streak, completedLessons: Object.values(state.lessons).filter(l=>l.completed).map(l=>l.lessonId) },
        mode: "chat",
      }),
    });
    if (res.ok && res.body) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      const msgId = `a-${Date.now()}`;
      state.chatMessages.push({ id: msgId, role: "assistant", content: "", timestamp: Date.now() });
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        for (const line of lines) {
          const t = line.trim();
          if (!t.startsWith("data:")) continue;
          const d = t.slice(5).trim();
          if (d === "[DONE]") continue;
          try { const p = JSON.parse(d); if (p.token) { reply += p.token; state.chatMessages[state.chatMessages.length-1].content = reply; render(); } } catch(e) {}
        }
      }
    } else { throw new Error("backend unavailable"); }
  } catch(e) {
    // Fallback — local canned responses
    reply = generateLocalReply(text);
    state.chatMessages.push({ id: `a-${Date.now()}`, role: "assistant", content: reply, timestamp: Date.now() });
    render();
  }
  saveState();
}

function generateLocalReply(text) {
  const t = text.toLowerCase();
  if (t.includes("θ") || t.includes("th")) return "For /θ/ (as in 'think'): place your tongue tip lightly between your upper and lower teeth. Blow air out gently. It's voiceless. 💡 Practice: 'three thick thorns'. Repeat slowly.";
  if (t.includes("r")) return "American /r/: curl your tongue back slightly without touching the roof of your mouth. Lips round forward. 💡 Try 'red car, far away'. Don't trill — keep it smooth.";
  if (t.includes("æ") || t.includes("cat") || t.includes("trap")) return "/æ/ as in 'cat': drop your jaw LOW, flatten your tongue forward. Spread your lips. 💡 Most learners make it too close to /e/. Drop lower — like biting an apple.";
  if (t.includes("stress") || t.includes("photograph")) return "Word stress in 'photograph': PHO-to-graph (stress on syllable 1). Compare: pho-TOG-ra-phy (stress 2), pho-to-GRAPH-ic (stress 3). Same root, different stress! 📊";
  return "Great question! 💡 In general, focus on: (1) tongue position — feel where it sits, (2) lip shape — round or spread, (3) jaw height — high or low. Practice in front of a mirror. Try a specific sound like /θ/, /æ/, or /r/ and I'll give you exact physical guidance. 🎯";
}

      step.title ? el("div", { class: "h2", style: "margin-bottom:16px" }, step.title) : null,
      el("div", { class: "phrase-card-dark" }, [
        el("div", { class: "h2", style: "margin-bottom:8px" }, step.phrase),
        el("div", { class: "ipa" }, step.ipa),
        el("button", { class: "btn", style: "background:rgba(255,255,255,0.15);color:#fff;margin-top:14px;border-radius:100px", onclick: () => speak(step.phrase, { accent: state.accent }) }, "🔊 Listen"),
      ]),
      step.tapWords && step.tapWords.length > 0 ? el("div", {}, [
        el("div", { class: "caption", style: "margin-bottom:8px" }, "TAP TO HEAR"),
        el("div", { style: "display:flex;flex-wrap:wrap;gap:8px" }, step.tapWords.map((w,i) =>
          el("button", { class: "card", style: "cursor:pointer", onclick: () => speak(w.word, { accent: state.accent }) }, [
            el("div", { class: "body", style: "font-weight:600" }, w.word),
            el("div", { class: "caption" }, w.ipa),
          ])
        )),
      ]) : null,
      step.tip ? el("div", { class: "tip-box tip-warning" }, [ "💡", el("div", { class: "body-sm", style: "flex:1" }, step.tip) ]) : null,
    ]);
    case "tap-pronounce": return el("div", {}, [
      el("div", { class: "step-badge" }, "TAP TO HEAR"),
      step.title ? el("div", { class: "h2", style: "margin-bottom:12px" }, step.title) : null,
      step.description ? el("div", { class: "body muted", style: "margin-bottom:16px" }, step.description) : null,
      ...step.words.map(w =>
        el("button", { class: "tap-word", onclick: () => speak(w.word, { accent: state.accent }) }, [
          el("div", {}, [
            el("div", { class: "body", style: "font-weight:600" }, w.word),
            el("div", { class: "caption" }, w.ipa),
          ]),
          el("div", { style: "display:flex;align-items:center;gap:8px" }, [
            w.meaning ? el("div", { class: "caption", style: "color:#10b981;font-weight:600" }, w.meaning) : null,
            "🔊",
          ]),
        ])
      ),
    ]);
    case "tip": return el("div", { class: `tip-box tip-${step.variant || "info"}` }, [
      "💡",
      el("div", { style: "flex:1" }, [
        el("div", { class: "h3", style: "margin-bottom:6px" }, step.title || "Tip"),
        el("div", { class: "body" }, step.body),
      ]),
    ]);
    case "practice": return el("div", {}, [
      el("div", { class: "step-badge" }, "PRACTICE"),
      el("div", { class: "h1", style: "margin-bottom:16px" }, step.title || "Now you try"),
      el("div", { class: "phrase-card-dark" }, [
        el("div", { class: "h2", style: "margin-bottom:6px" }, step.phrase),
        el("div", { class: "ipa" }, step.ipa),
      ]),
      step.tip ? el("div", { class: "tip-box tip-warning", style: "margin-bottom:16px" }, [ "💡", el("div", { class: "body-sm", style: "flex:1" }, step.tip) ]) : null,
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn btn-outline", onclick: () => speak(step.phrase, { accent: state.accent, rate: 0.9 }) }, "🔊 Listen"),
        el("button", { class: "btn", id: "practice-speak-btn", style: `background:${listening ? "#ef4444" : "#10b981"};color:#fff`, onclick: () => togglePracticeListen(step.phrase) }, listening ? "⏹ Stop" : "🎙️ Speak"),
      ]),
      practiceTranscript ? el("div", { class: "transcript-box", style: "margin-top:16px" }, [
        el("div", { class: "caption", style: "margin-bottom:4px" }, "YOU SAID"),
        el("div", { class: "body" }, practiceTranscript),
      ]) : null,
      practiceScore !== null ? el("div", { style: `margin-top:12px;display:flex;align-items:center;gap:12px;padding:14px;background:${practiceScore>=70?"#d1fae5":"#fef3c7"};border-radius:12px` }, [
        el("div", { style: `font-size:28px;font-weight:800;color:${practiceScore>=70?"#10b981":"#f59e0b"}` }, `${practiceScore}%`),
        el("div", {}, [
          el("div", { class: "body", style: "font-weight:600" }, practiceScore >= 80 ? "Excellent!" : practiceScore >= 60 ? "Good effort" : "Keep practicing"),
          el("div", { class: "caption" }, practiceScore >= (step.passScore || 70) ? "Passed — continue to finish" : `Score ${step.passScore || 70}%+ to pass`),
        ]),
      ]) : null,
    ]);
    case "quiz": return el("div", {}, [
      el("div", { class: "step-badge" }, "QUIZ"),
      el("div", { class: "h2", style: "margin-bottom:20px" }, step.question),
      ...step.options.map((opt, i) => {
        const isSelected = quizAnswer === i;
        const isCorrect = i === step.correct;
        const showCorrect = quizAnswer !== null && isCorrect;
        const showWrong = quizAnswer !== null && isSelected && !isCorrect;
        const cls = showCorrect ? "correct" : showWrong ? "wrong" : "";
        return el("button", { class: `quiz-option ${cls}`, onclick: () => { if (quizAnswer === null) { quizAnswer = i; render(); } } }, [
          el("div", { class: "quiz-letter" }, showCorrect ? "✓" : showWrong ? "✕" : String.fromCharCode(65+i)),
          el("div", { class: "body", style: "flex:1;font-weight:500" }, opt),
        ]);
      }),
      quizAnswer !== null ? el("div", { class: "card", style: "margin-top:16px" }, [
        el("div", { class: "caption", style: "margin-bottom:4px" }, "EXPLANATION"),
        el("div", { class: "body" }, step.explanation),
      ]) : null,
    ]);
    case "completion": return el("div", { style: "text-align:center;padding-top:20px" }, [
      el("div", { class: "onboard-logo", style: "background:#d1fae5;width:96px;height:96px;border-radius:30px;margin-bottom:20px" }, "🏆"),
      "✨",
      el("div", { class: "h1", style: "text-align:center;margin-bottom:8px" }, step.title),
      el("div", { class: "body muted", style: "text-align:center;margin-bottom:20px" }, step.subtitle),
      el("div", { class: "sound-card", style: "display:inline-flex;flex-direction:row;gap:16px;padding:16px 24px;margin-bottom:16px" }, [
        el("div", {}, [
          el("div", { class: "h1", style: "color:#10b981;font-size:28px" }, `+${step.xp}`),
          el("div", { class: "caption", style: "color:#059669;font-weight:600" }, "XP EARNED"),
        ]),
      ]),
      step.badge ? el("div", { class: "badge-chip", style: "background:#0a0a0a;color:#fff" }, step.badge) : null,
      step.nextLessonTitle ? el("div", { class: "caption", style: "margin-top:16px" }, `Next up: ${step.nextLessonTitle}`) : null,
    ]);
    default: return el("div", { class: "body" }, `(Step type "${step.type}" not yet implemented.)`);
  }
}

function togglePracticeListen(phrase) {
  if (listening) { try { getRecognition()?.stop(); } catch(e){} listening = false; render(); return; }
  const rec = getRecognition();
  if (!rec) { alert("Speech recognition not supported in this browser. Try Chrome or Edge."); return; }
  practiceTranscript = "";
  practiceScore = null;
  let accumulated = "";
  rec.onresult = (e) => {
    const r = e.results[e.results.length-1];
    if (r) { accumulated = r[0].transcript; practiceTranscript = accumulated; render(); }
  };
  rec.onend = () => {
    listening = false;
    const target = phrase.toLowerCase().replace(/[^a-z\s]/g,"");
    const heard = accumulated.toLowerCase().replace(/[^a-z\s]/g,"");
    const tw = target.split(/\s+/).filter(Boolean);
    const hw = heard.split(/\s+/).filter(Boolean);
    const matched = tw.filter(w => hw.includes(w)).length;
    practiceScore = tw.length > 0 ? Math.round((matched/tw.length)*100) : 0;
    render();
  };
  rec.onerror = () => { listening = false; render(); };
  rec.start();
  listening = true;
  render();
}

function completeLesson(lessonId, score, xp, badge) {
  const existing = state.lessons[lessonId];
  const isFirstTime = !existing?.completed;
  const newScore = existing ? Math.max(existing.score, score) : score;
  const earnedXP = isFirstTime ? xp : 0;
  const today = todayStr();
  let newStreak = state.streak;
  if (state.lastActiveDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    newStreak = state.lastActiveDate === yesterday ? state.streak + 1 : 1;
  } else if (state.streak === 0) { newStreak = 1; }
  let goalCompleted = state.dailyGoalCompleted;
  if (state.dailyGoalDate !== today) { goalCompleted = 1; }
  else if (isFirstTime) { goalCompleted = state.dailyGoalCompleted + 1; }
  const newBadges = badge && !state.badges.includes(badge) ? [...state.badges, badge] : state.badges;
  state.lessons = { ...state.lessons, [lessonId]: { lessonId, completed: true, score: newScore, completedAt: Date.now() } };
  state.xp += earnedXP;
  state.streak = newStreak;
  state.lastActiveDate = today;
  state.badges = newBadges;
  state.history = [{ date: today, score, lessonId }, ...state.history].slice(0, 50);
  state.dailyGoalDate = state.dailyGoalDate !== today ? today : state.dailyGoalDate;
  state.dailyGoalCompleted = goalCompleted;
  saveState();
}

// ─── Bottom Nav ───
function renderBottomNav(active) {
  const items = [
    { id: "dashboard", icon: "🏠", label: "Home" },
    { id: "journey", icon: "🗺️", label: "Journey" },
    { id: "practice", icon: "🎙️", label: "Practice" },
    { id: "coach", icon: "💬", label: "Coach" },
    { id: "more", icon: "⋯", label: "More" },
  ];
  return el("div", { class: "bottom-nav" }, items.map(item =>
    el("button", { class: `nav-item ${active === item.id ? "active" : ""}`, onclick: () => navigate(item.id) }, [
      el("div", { class: "nav-icon" }, item.icon),
      el("div", {}, item.label),
    ])
  ));
}

// ─── Init ───
render();
</script>
